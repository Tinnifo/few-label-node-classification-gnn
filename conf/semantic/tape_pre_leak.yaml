# A4 (amended): UNSTRIPPED LLM explanations, PRECOMPUTED — the LLMNodeBed
# gpt-4o-mini dumps WITHOUT stripping — the leak control, embedded and shipped
# in the data bundles. This is the exact view the H3 prior was measured on.
