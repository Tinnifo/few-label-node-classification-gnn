# Direction-2: CG3 + LLM semantic view + disparity/HSIC regularization.
# Placeholder — training raises NotImplementedError until wired up.
name: cg3_semantic

# architecture (mirrors cg3)
local_model: gcn
global_model: hgcn

# semantic regularization knobs (unused until implemented)
semantic_loss: hsic          # hsic | disparity
lambda_reg: 1.0

lr: 0.01
epochs: 1000
weight_decay: 5e-4
optimizer_weight_decay: 0.0
dropout: 0.6
hidden_local: 1024
hidden_global: 32
coarsen_level: 4
max_node_wgt: 50
channel_num: 4
node_wgt_embed_dim: 5

use_early_stopping: false
select_best_by: val_acc
patience: 9999
